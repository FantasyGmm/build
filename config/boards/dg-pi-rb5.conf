function post_family_tweaks__dg-pi-rb5_update_utils-linux() {

	# 开启遇到错误即中断
	set -e

	display_alert "开始安装编译依赖..." "info"
	apt-get update
	# 安装最基础的编译工具（利用 util-linux 自带的内部库实现自包含编译，无需额外底层库）
	apt-get install -y wget build-essential pkg-config

	# 定义需要的版本 (包含 --sector-size 的版本)
	UTIL_LINUX_VERSION="2.42"

	display_alert "下载 util-linux v${UTIL_LINUX_VERSION} 源码..." "info"
	wget -q --show-progress "https://mirrors.edge.kernel.org/pub/linux/utils/util-linux/v${UTIL_LINUX_VERSION}/util-linux-${UTIL_LINUX_VERSION}.tar.xz"
	tar -xf "util-linux-${UTIL_LINUX_VERSION}.tar.xz"
	cd "util-linux-${UTIL_LINUX_VERSION}"

	display_alert "配置并编译静态版 sfdisk..." "info"
	# 禁用动态库，强制生成静态二进制文件，并禁用不需要的特性
	./configure \
		--disable-shared \
		--enable-static \
		--without-python \
		--without-ncurses \
		--without-ncursesw \
		--without-systemd \
		--without-udev

	# 单独指定编译 sfdisk（Makefile 会自动处理依赖的 libfdisk, libsmartcols 等内部库，不会编译整个套件）
	make sfdisk

	display_alert "部署新版 sfdisk..." "info"
	# Ubuntu 的 PATH 中 /usr/local/sbin 优先于自带的 /usr/sbin
	# 直接放在这里既能默认覆盖系统行为，又不会破坏 apt 包管理器的原始文件
	cp sfdisk /usr/local/sbin/sfdisk
	chmod +x /usr/local/sbin/sfdisk

	# 验证安装
	display_alert "验证新版本：" "info"
	/usr/local/sbin/sfdisk --version

	display_alert "清理构建缓存..." "info"
	cd ..
	rm -rf "util-linux-${UTIL_LINUX_VERSION}" "util-linux-${UTIL_LINUX_VERSION}.tar.xz"

	return 0
}

function post_family_tweaks__dg-pi-rb5_extra_packages() {
	if ! qdg-pi-rb5_is_userspace_supported; then
		if [[ "${RELEASE}" != "" ]]; then
			display_alert "Missing userspace for ${BOARD}" "${RELEASE} does not have the userspace necessary to support the ${BOARD}" "warn"
		fi
		return 0
	fi

	if [[ "${RELEASE}" == "jammy" ]] || [[ "${RELEASE}" == "noble" ]]; then
		display_alert "Adding qcom-mainline PPA" "${BOARD}" "info"
		do_with_retries 3 chroot_sdcard add-apt-repository ppa:liujianfeng1994/qcom-mainline --yes --no-update
	fi

	if [[ "${RELEASE}" == "noble" ]] || [[ "${RELEASE}" == "trixie" ]]; then
		display_alert "Adding Mesa PPA For Ubuntu " "${BOARD}" "info"
		do_with_retries 3 chroot_sdcard add-apt-repository ppa:oibaf/graphics-drivers --yes --no-update
	fi

	do_with_retries 3 chroot_sdcard_apt_get_update
	do_with_retries 3 chroot_sdcard_apt_get_install vulkan-tools mesa-vulkan-drivers btop mtools zstd

	if [[ "${RELEASE}" == "noble" ]] || [[ "${RELEASE}" == "trixie" ]]; then
		do_with_retries 3 chroot_sdcard_apt_get_install qbootctl
	fi

	if [[ "${DESKTOP_ENVIRONMENT}" == "kde-plasma" ]]; then
		display_alert "Adding Extra KDE Package" "${BOARD}" "info"
		do_with_retries 3 chroot_sdcard_apt_get_install plasma-workspace-wayland plasma-desktop plasma-systemmonitor plasma-nm kde-standard kde-spectacle kinfocenter kscreen krfb kfind filelight \
		dolphin clinfo vulkan-tools wayland-utils
	fi

	if [[ "${RELEASE}" == "noble" ]] || [[ "${RELEASE}" == "trixie" ]]; then
		chroot_sdcard systemctl enable qbootctl.service
	fi

	# No driver support for suspend
	chroot_sdcard systemctl mask suspend.target
}

function post_family_tweaks_bsp__dg-pi-rb5_bsp_firmware_in_initrd() {
	display_alert "Adding to bsp-cli" "${BOARD}: firmware in initrd" "info"
	declare file_added_to_bsp_destination # Will be filled in by add_file_from_stdin_to_bsp_destination
	# Using Elish's firmware for now
	add_file_from_stdin_to_bsp_destination "/etc/initramfs-tools/hooks/dg-pi-rb5-firmware" <<- 'FIRMWARE_HOOK'
		#!/bin/bash
		[[ "$1" == "prereqs" ]] && exit 0
		. /usr/share/initramfs-tools/hook-functions
		for f in /lib/firmware/qcom/sm8250/Thundercomm/RB5/* ; do
			add_firmware "${f#/lib/firmware/}"
		done
		add_firmware "qcom/sm8250/a650_zap.mbn" # Extra one for dpu
		add_firmware "qcom/a650_sqe.fw"			# Extra one for dpu
		add_firmware "qcom/a650_gmu.bin"		# Extra one for gpu
	FIRMWARE_HOOK
	run_host_command_logged chmod -v +x "${file_added_to_bsp_destination}"
}
